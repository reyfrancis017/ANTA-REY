
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - ANTA Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #f4f3f0 url('BG.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR - SAME STYLE AS CONTACT */
    .navbar {
      background-color: #222;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 60px;
      gap: 10px;
    }

    .navbar-logo {
      height: 35px;
      width: auto;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .navbar-links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .navbar-links a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
      font-size: 14px;
    }

    .navbar-links a:hover {
      color: #d40000;
    }

    .logout-btn {
      background-color: #d40000;
      color: white;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .logout-btn:hover {
      background-color: #a00000;
    }

    /* MAIN CONTENT */
    .main-container {
      flex: 1;
      max-width: 880px;
      width: 92%;
      margin: 40px auto;
      background-color: #fcfbf9;
      padding: 36px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .page-title-wrap {
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #111;
    }

    h1 {
      margin: 0;
      color: #111;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .content-wrapper {
      display: flex;
      gap: 32px;
      align-items: stretch;
    }

    .sites-sidebar {
      flex: 1.1;
      padding: 28px 24px;
      background-color: white;
      border: 1px solid #e5e5e5;
      border-left: 4px solid #d40000;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .sites-sidebar h2 {
      margin: 0 0 12px;
      color: #111;
      font-size: 19px;
      font-weight: 700;
    }

    .sites-sidebar p {
      margin: 0;
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    .sites-container {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .site-box {
      background-color: white;
      padding: 14px 18px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .site-link {
      text-decoration: none;
      color: #111;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 8px 14px;
      background-color: #d40000;
      color: white;
      border: 1px solid #d40000;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .action-btn:hover {
      background-color: #a00000;
    }

    .action-btn-outline {
      background-color: white;
      color: #333;
      border: 1px solid #ccc;
    }

    .action-btn-outline:hover {
      background-color: #f0f0f0;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 20px;
      background-color: #222;
      color: white;
      font-size: 13px;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .navbar {
        height: auto;
        flex-wrap: wrap;
        justify-content: space-between;
        padding: 10px;
        gap: 12px;
      }

      .navbar-logo {
        height: 35px;
      }

      .navbar-links {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 16px;
      }

      .navbar-links a {
        margin: 0;
        padding: 6px 0;
        font-size: 14px;
      }

      .logout-btn {
        font-size: 13px;
      }

      .main-container {
        width: 94%;
        padding: 20px;
        margin: 20px auto;
      }

      .content-wrapper {
        flex-direction: column;
        gap: 18px;
      }

      .sites-sidebar {
        padding: 22px 18px;
      }

      .site-box {
        padding: 14px;
      }

      .btn-group {
        width: 100%;
      }

      .action-btn {
        flex: 1;
        padding: 9px 8px;
      }

      h1 {
        font-size: 22px;
      }
    }

    @media (max-width: 360px) {
      .navbar-links {
        gap: 12px;
      }

      .navbar-links a {
        font-size: 13px;
      }

      .main-container {
        padding: 15px;
      }

      .site-box {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <img src="/logo1.webp" alt="ANTA Logo" class="navbar-logo">

    <div class="navbar-links">
      <a href="/index.html">Home</a>
      <a href="/ABOUT.html">About</a>
      <a href="/contact.html">Contact</a>
    </div>

    <a href="/LOGIN.html" class="logout-btn">Log Out</a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-container">

    <div class="page-title-wrap">
      <h1>About Us</h1>
    </div>

    <div class="content-wrapper">

      <div class="sites-sidebar"
           id="sidebar-card"
           onclick="goToCurrentSite()">

        <h2 id="site-title">Social Media</h2>

        <p id="site-description">
          Connect with us and our network on various social media platforms
          to stay updated with the latest news, events, and promotions.
        </p>
      </div>

      <div class="sites-container">

        <div class="site-box">
          <a href="javascript:void(0)"
             class="site-link"
             onclick="updateSiteContent('facebook')">
            Facebook
          </a>

          <div class="btn-group">
            <button class="action-btn action-btn-outline"
                    onclick="updateSiteContent('facebook')">
              View Details
            </button>

            <button class="action-btn"
                    onclick="openSite('facebook')">
              Visit Link
            </button>
          </div>
        </div>

        <div class="site-box">
          <a href="javascript:void(0)"
             class="site-link"
             onclick="updateSiteContent('instagram')">
            Instagram
          </a>

          <div class="btn-group">
            <button class="action-btn action-btn-outline"
                    onclick="updateSiteContent('instagram')">
              View Details
            </button>

            <button class="action-btn"
                    onclick="openSite('instagram')">
              Visit Link
            </button>
          </div>
        </div>

        <div class="site-box">
          <a href="javascript:void(0)"
             class="site-link"
             onclick="updateSiteContent('twitter')">
            Twitter
          </a>

          <div class="btn-group">
            <button class="action-btn action-btn-outline"
                    onclick="updateSiteContent('twitter')">
              View Details
            </button>

            <button class="action-btn"
                    onclick="openSite('twitter')">
              Visit Link
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    2026 ANTA Sports. All rights reserved.
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const siteContent = {
      facebook: {
        title: "Facebook",
        description: "Our Facebook page is a great way to stay connected with the community. You can join discussions, see new product announcements, and catch up on the latest news.",
        url: "https://www.facebook.com/"
      },

      instagram: {
        title: "Instagram",
        description: "Follow us on Instagram for daily photo updates, behind-the-scenes content, and style inspiration. It's the best way to see our products in action.",
        url: "https://www.instagram.com/"
      },

      twitter: {
        title: "Twitter",
        description: "Get real-time updates and quick news bites on our Twitter feed. We share flash sales, new blog posts, and engage with the community directly.",
        url: "https://x.com/"
      }
    };

    let currentSiteUrl = "https://www.facebook.com/";

    function updateSiteContent(site) {
      const titleElement = document.getElementById("site-title");
      const descriptionElement = document.getElementById("site-description");

      if (siteContent[site]) {
        titleElement.textContent = siteContent[site].title;
        descriptionElement.textContent = siteContent[site].description;
        currentSiteUrl = siteContent[site].url;
      }
    }

    function openSite(site) {
      if (siteContent[site] && siteContent[site].url) {
        window.open(siteContent[site].url, "_blank", "noopener");
      }
    }

    function goToCurrentSite() {
      if (currentSiteUrl) {
        window.open(currentSiteUrl, "_blank", "noopener");
      }
    }
  </script>

</body>
</html>
