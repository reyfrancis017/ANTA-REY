<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - ANTA Shop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f3f0 url('BG.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    .navbar { 
      background-color: #2c2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      height: 64px;
      position: relative;
    }

    .navbar-logo {
      height: 45px;
      width: auto;
      border-radius: 8px;
    }

    .navbar-links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .navbar-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
    }

    .navbar-links a:hover {
      background-color: #444;
    }

    .logout-btn {
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }

    .main-container {
      flex: 1;
      max-width: 880px;
      width: 92%;
      margin: 40px auto;
      background-color: #fcfbf9;
      padding: 36px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .page-title-wrap {
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #111111;
    }

    h1 {
      margin: 0;
      color: #111111;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .content-wrapper {
      display: flex;
      gap: 32px;
      align-items: stretch;
    }

    .sites-sidebar {
      flex: 1.1;
      padding: 28px 24px;
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      border-left: 4px solid #d40000;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .sites-sidebar h2 {
      margin: 0 0 12px 0;
      color: #111111;
      font-size: 19px;
      font-weight: 700;
    }

    .sites-sidebar p {
      margin: 0;
      color: #555555;
      font-size: 14px;
      line-height: 1.6;
    }

    .sites-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .site-box {
      background-color: #ffffff;
      padding: 14px 18px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-link {
      text-decoration: none;
      color: #111111;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 8px 14px;
      background-color: #d40000;
      color: #ffffff;
      border: 1px solid #d40000;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .action-btn:hover {
      background-color: #a00000;
    }

    .action-btn-outline {
      background-color: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
    }

    .action-btn-outline:hover {
      background-color: #f0f0f0;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background-color: #222222;
      color: #ffffff;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .navbar-links {
        position: static;
        transform: none;
      }
      .content-wrapper {
        flex-direction: column;
      }
      .main-container {
        padding: 20px;
        margin: 20px auto;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <img src="logo1.webp" alt="ANTA Logo" class="navbar-logo">
    <div class="navbar-links">
      <a href="index.html">Hompage</a>
      <a href="ABOUT.HTML">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <a href="login.html" class="logout-btn">Log Out</a>
  </div>

  <div class="main-container">
    <div class="page-title-wrap">
      <h1>About Us</h1>
    </div>

    <div class="content-wrapper">
      <div class="sites-sidebar" id="sidebar-card" onclick="goToCurrentSite()">
        <h2 id="site-title">Social Media</h2>
        <p id="site-description">
          Connect with us and our network on various social media platforms to stay updated with the latest news, events, and promotions.
        </p>
      </div>

      <div class="sites-container">
        <div class="site-box">
          <a href="javascript:void(0)" class="site-link" onclick="updateSiteContent('facebook')">Facebook</a>
          <div class="btn-group">
            <button class="action-btn action-btn-outline" onclick="updateSiteContent('facebook')">View Details</button>
            <button class="action-btn" onclick="openSite('facebook')">Visit Link</button>
          </div>
        </div>

        <div class="site-box">
          <a href="javascript:void(0)" class="site-link" onclick="updateSiteContent('instagram')">Instagram</a>
          <div class="btn-group">
            <button class="action-btn action-btn-outline" onclick="updateSiteContent('instagram')">View Details</button>
            <button class="action-btn" onclick="openSite('instagram')">Visit Link</button>
          </div>
        </div>

        <div class="site-box">
          <a href="javascript:void(0)" class="site-link" onclick="updateSiteContent('twitter')">Twitter</a>
          <div class="btn-group">
            <button class="action-btn action-btn-outline" onclick="updateSiteContent('twitter')">View Details</button>
            <button class="action-btn" onclick="openSite('twitter')">Visit Link</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    2026 ANTA Sports. All rights reserved.
  </div>

  <script>
    const siteContent = {
      facebook: {
        title: "Facebook",
        description: "Our Facebook page is a great way to stay connected with the community. You can join discussions, see new product announcements, and catch up on the latest news.",
        url: "https://www.facebook.com/"
      },
      instagram: {
        title: "Instagram",
        description: "Follow us on Instagram for daily photo updates, behind-the-scenes content, and style inspiration. It's the best way to see our products in action.",
        url: "https://www.instagram.com/"
      },
      twitter: {
        title: "Twitter",
        description: "Get real-time updates and quick news bites on our Twitter feed. We share flash sales, new blog posts, and engage with the community directly.",
        url: "https://x.com/"
      }
    };

    let currentSiteUrl = "https://www.facebook.com/";

    function updateSiteContent(site) {
      const titleElement = document.getElementById("site-title");
      const descriptionElement = document.getElementById("site-description");

      if (siteContent[site]) {
        titleElement.textContent = siteContent[site].title;
        descriptionElement.textContent = siteContent[site].description;
        currentSiteUrl = siteContent[site].url;
      }
    }

    function openSite(site) {
      if (siteContent[site] && siteContent[site].url) {
        window.open(siteContent[site].url, "_blank");
      }
    }

    function goToCurrentSite() {
      if (currentSiteUrl) {
        window.open(currentSiteUrl, "_blank");
      }
    }
  </script>

</body>
</html>
